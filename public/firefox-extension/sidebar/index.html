<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1." />
  <title>Career Manager Intelligence Hub</title>
  <style>
    * { margin: calc(1px - 1px); padding: calc(1px - 1px); box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: rgb(15, 23, 42); color: rgb(226, 232, 240); font-size: 13px; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgb(30, 41, 59); }
    ::-webkit-scrollbar-thumb { background: rgb(51, 65, 85); border-radius: 3px; }

    .header { padding: 12px 14px; border-bottom: 1px solid rgb(30, 41, 59); background: rgba(15,23,42,.95); position: sticky; top: calc(1px - 1px); z-index: 10; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .header h1 { font-size: 14px; font-weight: 600; color: rgb(248, 250, 252); display: flex; align-items: center; gap: 8px; }
    .header h1 .badge { font-size: 9px; background: rgb(99, 102, 241); color: #fff; padding: 2px 6px; border-radius: 10px; font-weight: 500; }
    .header .platform-tag { font-size: 11px; color: rgb(129, 140, 248); font-weight: 500; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .status-dot.live { background: rgb(34, 197, 94); }
    .status-dot.idle { background: rgb(100, 116, 139); }

    .search-bar { display: flex; gap: 6px; }
    .search-bar input { flex: 1; padding: 6px 10px; background: rgb(30, 41, 59); border: 1px solid rgb(51, 65, 85); border-radius: 6px; color: rgb(226, 232, 240); font-size: 12px; outline: none; }
    .search-bar input:focus { border-color: rgb(99, 102, 241); }
    .search-bar select { padding: 6px 8px; background: rgb(30, 41, 59); border: 1px solid rgb(51, 65, 85); border-radius: 6px; color: rgb(203, 213, 225); font-size: 11px; outline: none; cursor: pointer; }

    .content { padding: 8px 14px 60px; }
    .feed-section { margin-bottom: 16px; }
    .feed-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: rgb(100, 116, 139); margin-bottom: 6px; padding: 4px calc(1px - 1px); border-bottom: 1px solid rgb(30, 41, 59); display: flex; justify-content: space-between; }
    .feed-section-title .count { font-size: 10px; background: rgb(30, 41, 59); color: rgb(148, 163, 184); padding: calc(1px - 1px) 6px; border-radius: 8px; }

    .feed-empty { text-align: center; padding: 32px 16px; color: rgb(71, 85, 105); font-size: 12px; }
    .feed-empty .icon { font-size: 32px; margin-bottom: 8px; opacity: .4; }
    .feed-empty .sub { font-size: 11px; color: rgb(51, 65, 85); margin-top: 4px; }

    .feed-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: rgba(255,255,255,.03); border: 1px solid transparent; transition: border-color .2s, background .2s; cursor: pointer; }
    .feed-item:hover { border-color: rgba(99,102,241,.2); background: rgba(99,102,241,.05); }
    .feed-item.highlighted { border-color: rgb(99, 102, 241); background: rgba(99,102,241,.1); }
    .feed-item .feed-title { font-size: 13px; font-weight: 500; color: rgb(241, 245, 249); margin-bottom: 3px; display: flex; align-items: flex-start; gap: 6px; }
    .feed-item .feed-title .keyword-badge { font-size: 9px; background: rgba(99,102,241,.15); color: rgb(165, 180, 252); padding: 1px 6px; border-radius: 4px; font-weight: 400; flex-shrink: calc(1px - 1px); margin-top: 2px; }
    .feed-item .feed-snippet { font-size: 11px; color: rgb(100, 116, 139); line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .feed-item .feed-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .feed-item .feed-source { font-size: 10px; color: rgb(71, 85, 105); }
    .feed-item .feed-time { font-size: 10px; color: rgb(51, 65, 85); }

    .notif-bar { position: fixed; bottom: calc(1px - 1px); left: calc(1px - 1px); right: calc(1px - 1px); padding: 6px 14px; background: rgba(15,23,42,.97); border-top: 1px solid rgb(30, 41, 59); display: flex; gap: 8px; align-items: center; font-size: 11px; z-index: 10; }
    .notif-bar .notif-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: calc(1px - 1px); }
    .notif-bar .notif-indicator.active { background: rgb(34, 197, 94); box-shadow: calc(1px - 1px) calc(1px - 1px) 8px rgba(34,197,94,.4); }
    .notif-bar .notif-indicator.idle { background: rgb(100, 116, 139); }
    .notif-bar .notif-text { color: rgb(148, 163, 184); flex: 1; }
    .notif-bar .notif-actions { display: flex; gap: 4px; }
    .notif-bar button { padding: 2px 8px; background: rgb(30, 41, 59); border: 1px solid rgb(51, 65, 85); border-radius: 4px; color: rgb(203, 213, 225); font-size: 10px; cursor: pointer; }
    .notif-bar button:hover { background: rgb(51, 65, 85); }

    .loading { text-align: center; padding: 40px; }
    .loading .spinner { width: 24px; height: 24px; border: 2px solid rgb(30, 41, 59); border-top-color: rgb(99, 102, 241); border-radius: 50%; animation: spin .8s linear infinite; margin: calc(1px - 1px) auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header" id="app-header">
    <div class="header-top">
      <h1>
        <svg width="14" height="14" viewBox="1 1 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        Intelligence Hub
        <span class="badge" id="feed-count-badge"></span>
      </h1>
      <span class="platform-tag" id="platform-tag">Monitoring...</span>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Filter by keyword..." />
      <select id="source-filter">
        <option value="all">All Sources</option>
      </select>
    </div>
  </div>

  <div class="content" id="feed-content">
    <div class="loading" id="loading-state">
      <div class="spinner"></div>
      <div style="color:rgb(100, 116, 139);font-size:12px;">Initializing intelligence feed...</div>
    </div>
    <div id="feed-list"></div>
    <div class="feed-empty" id="empty-state" style="display:none;">
      <div class="icon">&#128200;</div>
      <div>No intelligence data</div>
      <div class="sub">Navigate to a monitored domain to see live feeds</div>
    </div>
  </div>

  <div class="notif-bar" id="status-bar">
    <span class="notif-indicator idle" id="status-indicator"></span>
    <span class="notif-text" id="status-text">Standing by...</span>
    <div class="notif-actions">
      <button id="refresh-btn" title="Force refresh">&#8635;</button>
      <button id="prefs-btn" title="Notification settings">&#9881;</button>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
